[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; Librerías necesarias (se descargarán solas)
lib_deps =
    robtillaart/PCF8574 @ ^0.4.1
    pangodream/ESP2SOTA @ ^1.0.2
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    arduino-libraries/Ethernet @ ^2.0.2

; Particionado con DOS slots de app (~1.9 MB c/u) + pequeño SPIFFS/LittleFS.
; Requerido para OTA — `huge_app.csv` (anterior) tenía un único slot de 3 MB
; y no permitía actualizar firmware over-the-air. Si el sketch se acerca al
; límite de 1.9 MB, migrar a default_8MB.csv y usar un módulo ESP32 con 8 MB.
board_build.partitions = min_spiffs.csv